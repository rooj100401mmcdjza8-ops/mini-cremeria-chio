{% extends 'base.html' %}
{% block title %}Iniciar Sesión - Mi Negocio{% endblock %}
{% block content %}
<div class="card">
    <h2>Iniciar Sesión</h2>

    {% if form.errors %}
    <p style="color: red;">Usuario o contraseña incorrectos. Inténtalo de nuevo.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label for="id_username">Usuario:</label>
            {{ form.username }}
        </p>
        <p>
            <label for="id_password">Contraseña:</label>
            {{ form.password }}
        </p>
        <button type="submit" class="btn btn-success">Entrar</button>
        <a href="{% url 'inicio' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
